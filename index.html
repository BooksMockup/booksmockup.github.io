  <body class="bg-[#FAF8F5] text-stone-900 antialiased selection:bg-amber-600/20 selection:text-stone-900">
    <div id="root"></div>
    <script>
      window.__loadStaticFallback = function () {
        if (window.__BOOKS_MOCKUP_MOUNTED__ || window.__BOOKS_MOCKUP_FALLBACK_LOADING__) return;
        var root = document.getElementById('root');
        if (root && root.children && root.children.length > 0) return;
        window.__BOOKS_MOCKUP_FALLBACK_LOADING__ = true;

        var css = document.createElement('link');
        css.rel = 'stylesheet';
        css.href = './static-build/app.css';
        document.head.appendChild(css);

        var js = document.createElement('script');
        js.type = 'module';
        js.src = './static-build/app.js';
        document.body.appendChild(js);
      };
      window.addEventListener('DOMContentLoaded', function () {
        setTimeout(function () {
          if (!window.__BOOKS_MOCKUP_MOUNTED__) {
            window.__loadStaticFallback();
          }
        }, 900);
      });
    </script>
    <script type="module" src="/src/main.tsx" onerror="window.__loadStaticFallback && window.__loadStaticFallback()"></script>
  </body>
